<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TechStore — Tienda Virtual</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:           #f8fafc;
        --surface:      #ffffff;
        --surface-2:    #f1f5f9;
        --primary:      #2563eb;
        --primary-dark: #1d4ed8;
        --primary-soft: #eff6ff;
        --text:         #0f172a;
        --muted:        #64748b;
        --border:       #e2e8f0;
        --shadow:       0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
        --radius:       12px;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      /* ── Header ─────────────────────────────────────── */
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--primary);
        letter-spacing: -.03em;
      }

      .logo span { color: var(--text); }

      nav {
        display: flex;
        align-items: center;
        gap: .5rem;
        flex-wrap: wrap;
      }

      #category-filters {
        display: flex;
        gap: .4rem;
        flex-wrap: wrap;
      }

      .cat-btn {
        padding: .4rem .9rem;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 999px;
        font-size: .83rem;
        font-weight: 500;
        color: var(--muted);
        cursor: pointer;
        transition: all .15s;
        font-family: inherit;
      }

      .cat-btn:hover { border-color: var(--primary); color: var(--primary); }
      .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

      .admin-link {
        padding: .4rem .9rem;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: .83rem;
        font-weight: 500;
        color: var(--muted);
        text-decoration: none;
        transition: all .15s;
        margin-left: .5rem;
        font-family: inherit;
      }

      .admin-link:hover { color: var(--primary); border-color: var(--primary); }

      /* ── Hero ────────────────────────────────────────── */
      .hero {
        text-align: center;
        padding: 3rem 1.5rem 2rem;
      }

      .hero h1 {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -.03em;
      }

      .hero p {
        color: var(--muted);
        margin-top: .5rem;
        font-size: 1.05rem;
      }

      /* ── Grid ────────────────────────────────────────── */
      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
        padding: 0 2rem 3rem;
        max-width: 1280px;
        margin: 0 auto;
      }

      .product-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        transition: box-shadow .2s, transform .2s;
      }

      .product-card:hover {
        box-shadow: 0 4px 12px rgba(0,0,0,.1);
        transform: translateY(-2px);
      }

      .product-img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        background: var(--surface-2);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: .85rem;
      }

      .product-img-placeholder {
        width: 100%;
        height: 200px;
        background: linear-gradient(135deg, var(--primary-soft), #dbeafe);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        color: var(--primary);
      }

      .product-body {
        padding: 1rem 1.1rem 1.1rem;
      }

      .product-category {
        font-size: .72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--primary);
        margin-bottom: .3rem;
      }

      .product-name {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: .3rem;
      }

      .product-desc {
        font-size: .85rem;
        color: var(--muted);
        line-height: 1.5;
        margin-bottom: .8rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .product-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .product-price {
        font-size: 1.2rem;
        font-weight: 800;
        color: var(--primary);
      }

      .product-price::before { content: '$'; }

      .loading, .error-msg, .empty-msg {
        text-align: center;
        padding: 3rem 1.5rem;
        color: var(--muted);
        font-size: 1.05rem;
        grid-column: 1 / -1;
      }

      .error-msg { color: #ef4444; }

      /* ── Responsive ──────────────────────────────────── */
      @media (max-width: 640px) {
        header { padding: .8rem 1rem; flex-direction: column; align-items: stretch; }
        nav { justify-content: center; }
        .product-grid { padding: 0 1rem 2rem; grid-template-columns: 1fr; }
        .hero h1 { font-size: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">Tech<span>Store</span></div>
      <nav>
        <button class="cat-btn active" data-cat="">Todas</button>
        <div id="category-filters"></div>
        <a href="/static/admin.html" class="admin-link">Admin</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Productos Tecnológicos</h1>
      <p>Lo mejor en tecnología al mejor precio</p>
    </section>

    <div class="product-grid" id="product-grid">
      <div class="loading">Cargando productos...</div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
