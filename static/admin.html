<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TechStore — Panel Admin</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:           #f8fafc;
        --surface:      #ffffff;
        --surface-2:    #f1f5f9;
        --primary:      #2563eb;
        --primary-dark: #1d4ed8;
        --primary-soft: #eff6ff;
        --text:         #0f172a;
        --muted:        #64748b;
        --border:       #e2e8f0;
        --danger:       #ef4444;
        --success:      #22c55e;
        --shadow:       0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
        --radius:       10px;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      /* ── Login ───────────────────────────────────────── */
      #login-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
      }

      #login-screen.hidden { display: none; }

      .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2rem;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 8px 32px rgba(0,0,0,.1);
      }

      .login-card h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: .3rem; }
      .login-card > p { font-size: .88rem; color: var(--muted); margin-bottom: 1.5rem; }

      .login-card input {
        width: 100%;
        padding: .7rem .9rem;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-size: .95rem;
        outline: none;
        margin-bottom: .75rem;
        font-family: inherit;
        transition: border-color .15s;
      }

      .login-card input:focus { border-color: var(--primary); background: var(--surface); }

      .login-btn {
        width: 100%;
        padding: .75rem;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: var(--radius);
        font-size: .95rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: background .15s;
      }

      .login-btn:hover { background: var(--primary-dark); }

      .login-error {
        font-size: .83rem;
        color: var(--danger);
        text-align: center;
        min-height: 1.2rem;
        margin-bottom: .5rem;
      }

      /* ── Dashboard ───────────────────────────────────── */
      #dashboard.hidden { display: none; }

      .admin-header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .admin-header h2 { font-size: 1.2rem; font-weight: 700; }

      .admin-header .right { display: flex; align-items: center; gap: 1rem; }

      .admin-header .username { font-size: .88rem; color: var(--muted); }

      .btn-outline {
        padding: .45rem 1rem;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 8px;
        font-size: .85rem;
        font-weight: 500;
        color: var(--muted);
        cursor: pointer;
        font-family: inherit;
        transition: all .15s;
      }

      .btn-outline:hover { border-color: var(--danger); color: var(--danger); }

      .btn-primary {
        padding: .5rem 1.2rem;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: .88rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: background .15s;
      }

      .btn-primary:hover { background: var(--primary-dark); }

      .btn-sm {
        padding: .3rem .7rem;
        font-size: .8rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        cursor: pointer;
        font-family: inherit;
        transition: all .15s;
      }

      .btn-sm.edit { color: var(--primary); }
      .btn-sm.toggle { color: var(--danger); }
      .btn-sm.edit:hover { background: var(--primary-soft); border-color: var(--primary); }
      .btn-sm.toggle:hover { background: #fef2f2; border-color: var(--danger); }

      .admin-body { padding: 1.5rem 2rem; }

      .admin-body .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.2rem;
      }

      .table-wrap {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: .88rem;
      }

      th {
        text-align: left;
        padding: .7rem .9rem;
        font-weight: 600;
        font-size: .78rem;
        text-transform: uppercase;
        letter-spacing: .05em;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        background: var(--surface-2);
      }

      td {
        padding: .7rem .9rem;
        border-bottom: 1px solid var(--border);
      }

      tr:last-child td { border-bottom: none; }

      .badge {
        display: inline-block;
        padding: .15rem .55rem;
        border-radius: 999px;
        font-size: .75rem;
        font-weight: 600;
      }

      .badge.active { background: #dcfce7; color: #166534; }
      .badge.inactive { background: #fef2f2; color: #991b1b; }

      .td-actions { display: flex; gap: .4rem; }

      /* ── Modal ────────────────────────────────────────── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.4);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 1.5rem;
      }

      .modal-overlay.hidden { display: none; }

      .modal {
        background: var(--surface);
        border-radius: 16px;
        padding: 2rem;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 8px 32px rgba(0,0,0,.15);
      }

      .modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.2rem; }

      .modal label {
        display: block;
        font-size: .84rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: .3rem;
        margin-top: .8rem;
      }

      .modal label:first-of-type { margin-top: 0; }

      .modal input, .modal select, .modal textarea {
        width: 100%;
        padding: .6rem .8rem;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: .9rem;
        outline: none;
        font-family: inherit;
        transition: border-color .15s;
      }

      .modal input:focus, .modal select:focus, .modal textarea:focus {
        border-color: var(--primary);
        background: var(--surface);
      }

      .modal textarea { resize: vertical; min-height: 70px; }

      .modal .modal-actions {
        display: flex;
        gap: .6rem;
        margin-top: 1.2rem;
        justify-content: flex-end;
      }

      @media (max-width: 640px) {
        .admin-header { padding: .8rem 1rem; flex-wrap: wrap; gap: .5rem; }
        .admin-body { padding: 1rem; }
        .table-wrap { font-size: .8rem; }
        th, td { padding: .5rem .6rem; }
      }
    </style>
  </head>
  <body>

    <!-- Login -->
    <div id="login-screen">
      <div class="login-card">
        <h1>Panel Admin</h1>
        <p>Ingresá para administrar la tienda</p>
        <div class="login-error" id="login-error"></div>
        <input type="text"     id="login-username" placeholder="Usuario" autocomplete="username" />
        <input type="password" id="login-password" placeholder="Contraseña" autocomplete="current-password" />
        <button class="login-btn" id="login-btn">Ingresar</button>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
      <div class="admin-header">
        <h2>TechStore — Admin</h2>
        <div class="right">
          <span class="username" id="admin-username"></span>
          <button class="btn-outline" id="logout-btn">Cerrar sesión</button>
        </div>
      </div>

      <div class="admin-body">
        <div class="toolbar">
          <span id="product-count"></span>
          <button class="btn-primary" id="add-product-btn">+ Nuevo producto</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="product-table-body">
              <tr><td colspan="6" style="text-align:center;color:var(--muted);padding:2rem;">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay hidden" id="product-modal">
      <div class="modal">
        <h3 id="modal-title">Nuevo producto</h3>
        <form id="product-form">
          <label for="modal-nombre">Nombre</label>
          <input type="text" id="modal-nombre" required />

          <label for="modal-precio">Precio ($)</label>
          <input type="number" id="modal-precio" step="0.01" min="0" required />

          <label for="modal-descripcion">Descripción</label>
          <textarea id="modal-descripcion"></textarea>

          <label for="modal-categoria">Categoría</label>
          <select id="modal-categoria"></select>

          <label for="modal-imagen">URL de imagen</label>
          <input type="url" id="modal-imagen" placeholder="https://..." />

          <div class="modal-actions">
            <button type="button" class="btn-outline" id="modal-cancel">Cancelar</button>
            <button type="submit" class="btn-primary" id="modal-save">Guardar</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/static/admin.js"></script>
  </body>
</html>
